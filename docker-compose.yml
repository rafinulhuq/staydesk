# Local development stack: `docker compose up` starts the database, mail catcher and API.
# The web service is added once the Angular app talks to the API.
services:
  db:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-staydesk}
      POSTGRES_USER: ${POSTGRES_USER:-staydesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staydesk_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: src/StayDesk.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-staydesk};Username=${POSTGRES_USER:-staydesk};Password=${POSTGRES_PASSWORD:-staydesk_dev}
      Seed__DemoData: "true"
      # Demo account passwords are public (README); set real ones on the deployed demo.
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-Admin123}
      Seed__StaffPassword: ${SEED_STAFF_PASSWORD:-Staff123}
      Seed__GuestPassword: ${SEED_GUEST_PASSWORD:-Guest123}
    ports:
      - "${API_PORT:-8080}:8080"

  mail:
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

volumes:
  db-data:
